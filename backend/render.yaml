services:
  - type: web
    name: stock-analysis-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        value: https://stock-analysis-frontend.onrender.com
    healthCheckPath: /api/health
    autoDeploy: true

  - type: web
    name: stock-analysis-frontend
    env: static
    buildCommand: cd ../frontend && npm install && npm run build
    staticPublishPath: ../frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://stock-analysis-backend.onrender.com/api
    autoDeploy: true